name: Run Sparkov validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/run-sparkov.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download Sparkov train dataset
        run: |
          mkdir -p data
          curl -L --fail --retry 3 "https://huggingface.co/datasets/dazzle-nu/CIS435-CreditCardFraudDetection/resolve/main/fraudTrain.csv" -o data/fraudTrain.csv
      - name: Run same Simple-vs-History validation
        run: |
          python experiments/sparkov_history_experiment.py --csv data/fraudTrain.csv --output-dir results/sparkov --iterations 150 --bootstrap 300
      - name: Commit validation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/sparkov/summary.json results/sparkov/history_group_results.csv
          git commit -m "Add Sparkov external validation results" || exit 0
          git pull --rebase
          git push
