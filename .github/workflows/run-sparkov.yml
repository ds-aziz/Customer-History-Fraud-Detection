name: Run Sparkov validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/run-sparkov.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download Sparkov train dataset
        run: |
          mkdir -p data
          curl -L --fail --retry 3 "https://huggingface.co/datasets/dazzle-nu/CIS435-CreditCardFraudDetection/resolve/main/fraudTrain.csv" -o data/fraudTrain.csv
      - name: Run Sparkov multiseed robustness validation
        run: |
          python experiments/sparkov_multiseed_validation.py \
            --csv data/fraudTrain.csv \
            --output-dir results/sparkov_robustness \
            --iterations 60 \
            --seeds 11,22,33,44,55 \
            --group-bootstrap 200
      - name: Commit robustness results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/sparkov_robustness/summary.json \
                     results/sparkov_robustness/multiseed_overall.csv \
                     results/sparkov_robustness/multiseed_history_groups.csv \
                     results/sparkov_robustness/history_group_summary.csv
          git commit -m "Add Sparkov multiseed robustness results" || exit 0
          git pull --rebase
          git push
