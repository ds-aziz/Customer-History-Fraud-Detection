name: Import BankSim dataset

on:
  push:
    paths:
      - ".github/workflows/import-banksim.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-banksim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download BankSim CSV
        run: |
          mkdir -p data
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/prinz-nussknacker/banksim1/master/bs140513_032310.csv \
            -o data/bs140513_032310.csv

      - name: Validate dataset
        run: |
          python - <<'PY'
          import csv
          p = "data/bs140513_032310.csv"
          rows = 0
          customers = set()
          frauds = 0
          with open(p, newline="", encoding="utf-8") as f:
              r = csv.DictReader(f)
              for row in r:
                  rows += 1
                  customers.add(row["customer"])
                  frauds += int(row["fraud"])
          assert rows == 594643, rows
          assert len(customers) == 4112, len(customers)
          assert frauds == 7200, frauds
          print({"rows": rows, "customers": len(customers), "frauds": frauds})
          PY

      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/bs140513_032310.csv
          if git diff --cached --quiet; then
            echo "Dataset already present; nothing to commit."
            exit 0
          fi
          git commit -m "Add BankSim dataset"
          git push
